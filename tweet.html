<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="https://ompomz.github.io/favicon.ico">
<title>tweets recap</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans JP", sans-serif; line-height: 1.5; background-color: #f7f7f7; color: #666; font-size: 0.9rem; padding: 0.5rem; }
.container { max-width: 600px; margin: 0; padding: 0.5rem; border-radius: 4px; }
.container h1 { font-size: 1.3rem; }
.container h2 { font-size: 1.1rem; }
.container p { word-break: break-all; }
.container a { color: #66b3ff; text-decoration: none; }
.container a:hover { color: #4da6ff; text-decoration: underline; }
@media (max-width: 767px) { .container { max-width: 100%; } }
.container button { border: none; font-size: 0.8rem; padding: 0.5rem 0.8rem; border-radius: 999px; font-weight: bold; cursor: pointer; background-color: #ffb366; color: #fff; transition: background-color 0.3s ease, color 0.3s ease; }
.container button:hover { background-color: #ffa347; }
.header-section { display: flex; justify-content: flex-start; align-items: center; gap: 0.5rem; padding: 0.5rem 0; border-bottom: 1px dashed #ddd; }
#main-event { padding: 0.5rem 0; }
#status { margin: 0rem 0rem 1rem 0rem; font-weight: bold; color: #ff99cc; }
.reactions-list { display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 0.25rem 0rem 0.75rem 0rem; }
.reactions-list img{ height: 1.25rem !important; object-fit: cover;}
.reaction-group { display: flex; align-items: center; background-color: #eee; border-radius: 999px; padding: 0.2rem 0.5rem; font-size: 0.8rem; }
.reaction-avatars { display: flex; flex-direction: row-reverse; }
.reaction-avatar { width: 1.25rem; height: 1.25rem; border-radius: 50%; object-fit: cover; display: block; margin: 0; }
.related-posts { margin: 0.5rem 0rem; }
.related-post-card { background-color: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 0.25rem 0.5rem; margin: 0.5rem 0rem; }
.related-post-card .profile { display: flex; align-items: center; gap: 0.5rem; margin: 0.25rem 0rem; }
.related-post-card .profile-name, .related-post-card .profile-npub { font-size: 0.8rem; }
.related-post-card .profile-image { width: 1.5rem; height: 1.5rem; }
.related-post-card .post-content { font-size: 0.8rem; margin: 0.5rem 0rem 0.75rem 0rem; }
.profile { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
.profile-image { width: 2rem; height: 2rem; border-radius: 50%; object-fit: cover; }
.profile-name { font-weight: bold; font-size: 1rem; color: #444; }
.profile-nip05, .profile-npub { text-decoration: none !important; font-size: 0.8rem; color: #999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.profile-picture { width: 6rem; height: 6rem; border-radius: 50%; object-fit: cover; border: 3px solid rgba(0, 121, 107, 0.5); }
@media (max-width: 370px) { .profile-picture { width: 4.5rem; height: 4.5rem; } }
.profile-card { display: flex; flex-direction: column; gap: 1rem; padding: 1rem; background-color: #fff; border-radius: 8px; border: 1px solid #ddd; }
.profile-header { display: flex; align-items: center; gap: 1rem; }
.profile-info-container { flex: 1; display: flex; flex-direction: column; gap: 0.25rem; }
.npub-container { display: flex; align-items: center; gap: 0.5rem; font-size: 0.75rem; word-break: break-all; padding: 0.25rem 0rem 0rem 0rem; }
.copy-icon { cursor: pointer; transition: opacity 0.2s ease; }
.copy-icon:hover { opacity: 0.4; }
.about-text { font-size: 0.9rem; line-height: 1.5; color: #333; word-break: break-all; }
.about-text a { color: #66b3ff; text-decoration: underline; }
.about-text a:hover { color: #4da6ff; }
.about-text .custom-emoji { height: 1.2rem; vertical-align: middle; }
.post-info { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: #999; }
.post-content { margin: 0.5rem 0rem; line-height: 1.5; overflow-wrap: break-word; word-break: break-word; }
.post-content img { max-width: 15rem; max-height: 15rem; height: auto; display: block; margin: 0; }
.post-content img.custom-emoji { vertical-align: middle; display: inline-block; height: 1.2rem; }
.post-content ul, .post-content ol { list-style-position: inside; }
.nostr-form { display: flex; flex-direction: row; align-items: center; gap: 0.5rem; padding-top: 0.25rem; }
.form-input { color: #666; flex: 1; min-width: 0; width: 100%; max-width: 400px; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
.form-button { flex-shrink: 0; padding: 0.5rem 1.2rem !important; }
.footer-section { padding: 0.5rem 0; border-top: 1px dashed #ddd; }
.hidden { display: none; }
.modal { display: none; position: fixed; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0, 0, 0, 0.2); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
.modal-content { margin: auto; display: block; max-width: 80%; max-height: 80vh; width: 80%; }
.modal-image { width: auto; height: auto; max-width: 100%; max-height: 100%; object-fit: contain; display: block; margin: auto; }
.close-button { color: #fff; font-size: 40px; font-weight: 700; cursor: pointer; transition: 0.3s; }
.close-button:hover, .close-button:focus { color: #eee; text-decoration: none; cursor: pointer; }
.custom-emoji-hover:hover { transform: scale(2.0); z-index: 10; }
.post-image { max-height: 400px; object-fit: cover; }
</style>
</head>
<body>
<div id="header-placeholder"></div>
<div class="container">
  <div class="header-section">
    <button onclick="goBack()">もどる</button>
    <button onclick="copyUrl()">シェア</button>
    <button onclick="copyNevent()">コピー</button>
  </div>
  <div id="main-event"></div>
  <p id="status" class="hidden"></p>
  
  <div id="reactions-section" style="display: none;">
    <div id="reactions-list" class="reactions-list"></div>
  </div>
  
  <div id="related-events-section" style="display: none;">
    <div id="related-events-list" class="related-posts"></div>
  </div>

  <div class="footer-section">
    <button onclick="goBack()">もどる</button>
  </div>
</div>
<script src="https://unpkg.com/nostr-tools@1.17.0/lib/nostr.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://ompomz.github.io/tweetsrecap/utility.js"></script>
<script>
function goBack() {
  if (window.history.length > 1) {
    window.history.back();
  } else {
    window.location.href = 'https://ompomz.github.io/tweetsrecap/tweet';
  }
}

function copyUrl() {
  navigator.clipboard.writeText(window.location.href).then(() => {
    alert('URLがコピーされました！');
  }).catch(err => {
    console.error('URLのコピーに失敗しました:', err);
    alert('URLのコピーに失敗しました。');
  });
}

function copyNevent() {
  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get('id');
  
  if (id && (id.startsWith('nevent1') || id.startsWith('note1'))) {
    navigator.clipboard.writeText(id).then(() => {
      alert('イベントID(nevent)をコピーしました！');
    }).catch(err => {
      console.error('コピー失敗:', err);
    });
  } else {
    alert('コピーできるイベントIDが見つかりません。');
  }
}

const mainEventContainer = document.getElementById('main-event');
const statusElement = document.getElementById('status');
const reactionsSection = document.getElementById('reactions-section');
const reactionsList = document.getElementById('reactions-list');
const relatedEventsSection = document.getElementById('related-events-section');
const relatedEventsList = document.getElementById('related-events-list');

const FALLBACK_RELAYS = ['wss://relay.nostr.band', 'wss://nos.lol'];
const DEFAULT_PROFILE_IMAGE = 'https://ompomz.github.io/favicon.ico';
const pool = new window.NostrTools.SimplePool();
const userProfiles = {};

FALLBACK_RELAYS.forEach(url => {
  pool.ensureRelay(url).then(relay => {
    relay.on('connect', () => console.log(`✅ リレーに接続しました: ${url}`));
    relay.on('disconnect', () => console.warn(`⚠️ リレーから切断されました: ${url}`));
    relay.on('error', () => console.error(`❌ リレー接続エラー: ${url}`));
  }).catch(err => {
    console.error(`接続プールの設定中にエラーが発生しました: ${url}`, err);
  });
});

function showStatus(message) {
  statusElement.textContent = message;
  if (message) {
    statusElement.classList.remove('hidden');
  } else {
    statusElement.classList.add('hidden');
  }
}

function createNostrLink(nip19) {
  try {
    const decoded = window.NostrTools.nip19.decode(nip19);
    const { type, data } = decoded;

    if (type === 'note' || type === 'nevent') {
      return `?id=${nip19}`;
    } else if (type === 'npub' || type === 'nprofile') {
      const pubkey = data.id || data;
      const npub = window.NostrTools.nip19.npubEncode(pubkey);
      return `?id=${npub}`;
    } else if (type === 'naddr') {
      return `?id=${nip19}`;
    }

    return '#';
  } catch (e) {
    console.error('Failed to decode nostr link:', e);
    return '#';
  }
}

function replaceCustomEmojis(text, customEmojiMap) {
  if (!text || customEmojiMap.size === 0) {
    return text;
  }

  let formattedText = text;
  customEmojiMap.forEach((url, shortcode) => {
    const regex = new RegExp(`(?<=\\s|^)${shortcode}(?=\\s|$)`, 'g');
    formattedText = formattedText.replace(regex, `<img src="${url}" alt="${shortcode}" class="custom-emoji custom-emoji-hover">`);
  });
  return formattedText;
}

async function formatPostContent(content, tags) {
  // 1. エスケープと改行（ここは共通）
  let formattedContent = MyNostrUtils.escapeHtml(content);
  formattedContent = formattedContent.replace(/\n/g, '<br>');

  // 2. URLを判定して、画像ならそのまま表示、それ以外はリンクにする
  const urlRegex = /\b(https?:\/\/[^\s]+)/g;
  formattedContent = formattedContent.replace(urlRegex, (url) => {
    const imageExtensions = /\.(png|jpe?g|gif|webp|svg|heic|avif)$/i;
    if (imageExtensions.test(url)) {
      return `<img src="${url}" alt="post image" class="post-image" style="max-width:100%; height:auto; display:block; margin:10px 0;">`;
    }
    return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
  });

  // 3. Nostr IDの処理
  const nostrIdsToFetch = [];
  const placeholderRegex = /nostr:(n(?:event|note|pub|profile|addr)1\S+)/g;
  formattedContent = formattedContent.replace(placeholderRegex, (match, nip19) => {
    nostrIdsToFetch.push(nip19);
    return `<div data-nostr-id="${nip19}"></div>`;
  });

  // 4. カスタム絵文字
  const customEmojis = tags.filter(t => t[0] === 'emoji');
  const customEmojiMap = new Map();
  customEmojis.forEach(([_, shortcode, url]) => {
    customEmojiMap.set(`:${shortcode}:`, url);
  });
  formattedContent = replaceCustomEmojis(formattedContent, customEmojiMap);

  // 5. 非同期でカード挿入（ここは変更なし）
  const tempDiv = document.createElement('div');
  tempDiv.innerHTML = formattedContent;
  if (nostrIdsToFetch.length > 0) {
    await Promise.all(nostrIdsToFetch.map(async (nostrId) => {
      const cardHtml = await createNostrCard(nostrId);
      const placeholder = tempDiv.querySelector(`[data-nostr-id="${nostrId}"]`);
      if (placeholder) { placeholder.outerHTML = cardHtml; }
    }));
  }

  return tempDiv.innerHTML;
}

async function fetchProfiles(pubkeys) {
  console.log(`🔍 プロフィール取得を開始: ${pubkeys.length}件`);
  if (pubkeys.length === 0) return;

  const pubkeysToFetch = pubkeys.filter(pubkey => !userProfiles[pubkey]);
  if (pubkeysToFetch.length === 0) {
    console.log('✅ すでに全てのプロフィールがキャッシュされています。');
    return;
  }

  console.log(`🚀 新規プロフィールをリレーから取得: ${pubkeysToFetch.length}件`);
  const until = Math.floor(Date.now() / 1000);
  const profiles = await pool.list(FALLBACK_RELAYS, [{
    kinds: [0],
    authors: pubkeysToFetch,
    until: until
  }]);

  profiles.forEach(p => {
    try {
      userProfiles[p.pubkey] = JSON.parse(p.content);
      console.log(`✅ プロフィールをキャッシュしました: ${p.pubkey}`);
    } catch (e) {
      console.error('❌ プロフィールJSONのパースに失敗しました:', p.pubkey, e);
    }
  });
}

function createProfileHtml(pubkey, isLink = true) {
  const profile = userProfiles[pubkey] || {};
  const profilePicture = (profile.picture && profile.picture.trim() !== '') ? profile.picture : DEFAULT_PROFILE_IMAGE;
  const npub = window.NostrTools.nip19.npubEncode(pubkey);

  const profileContentHtml = `
    <div class="profile">
      <img src="${profilePicture}" class="profile-image" alt="User profile image">
      <div>
        <span class="profile-name">${MyNostrUtils.escapeHtml(profile.name || 'Unknown')}</span>
        <span class="profile-nip05">${profile.nip05 ? MyNostrUtils.escapeHtml(profile.nip05) : npub.substring(0, 13) + '...'}</span>
      </div>
    </div>
  `;
  if (isLink) {
    const profileUrl = `?id=${npub}`;
    return `<a href="${profileUrl}" class="profile-link">${profileContentHtml}</a>`;
  } else {
    return profileContentHtml;
  }
}

async function renderMainEvent(event, customEmojiMap) {
  console.log(`✨ メインイベントのレンダリングを開始: kind=${event.kind}, id=${event.id}`);
  const date = new Date(event.created_at * 1000).toLocaleString();
  const client = event.tags.find(t => t[0] === 'client')?.[1] || '';
  let contentHtml;

  if (event.kind === 30023) {
    contentHtml = window.marked.parse(event.content);
  } else {
    contentHtml = await formatPostContent(event.content, event.tags);
  }

  const html = `
    ${createProfileHtml(event.pubkey)}
    <div class="post-content">${contentHtml}</div>
    <div class="post-info">
      <span>${date}</span>
      ${client ? `<span>via ${MyNostrUtils.escapeHtml(client)}</span>` : ''}
    </div>
  `;
  mainEventContainer.innerHTML = html;
  console.log('✅ メインイベントのレンダリングが完了しました');
}

function renderReactions(reactions, customEmojiMap) {
  console.log(`👍 リアクションのレンダリングを開始: ${reactions.length}件`);
  const reactionGroups = new Map();

  reactions.forEach(reaction => {
    const emoji = reaction.content.trim();
    if (!reactionGroups.has(emoji)) {
      reactionGroups.set(emoji, {
        count: 0,
        pubkeys: new Set()
      });
    }
    const group = reactionGroups.get(emoji);
    group.count++;
    group.pubkeys.add(reaction.pubkey);
  });

  reactionsList.innerHTML = '';
  for (const [emoji, group] of reactionGroups.entries()) {
    const avatarsHtml = Array.from(group.pubkeys).map(pubkey => {
      const profile = userProfiles[pubkey] || {};
      const profilePicture = (profile.picture && profile.picture.trim() !== '') ? profile.picture : DEFAULT_PROFILE_IMAGE;
      const npub = window.NostrTools.nip19.npubEncode(pubkey);
      const profileUrl = `?id=${npub}`;
      return `<a href="${profileUrl}"><img src="${profilePicture}" class="reaction-avatar" alt="reaction user avatar"></a>`;
    }).join('');

    let displayedEmojiHtml = replaceCustomEmojis(emoji, customEmojiMap);
    if (displayedEmojiHtml === emoji) {
      const displayedEmoji = emoji === '+' ? '⭐' : emoji;
      displayedEmojiHtml = `<span class="reaction-emoji">${displayedEmoji}</span>`;
    }

    const groupHtml = `
      <div class="reaction-group">
        ${displayedEmojiHtml}
        <div class="reaction-avatars">${avatarsHtml}</div>
      </div>
    `;
    reactionsList.innerHTML += groupHtml;
  }
  reactionsSection.style.display = 'block';
  console.log('✅ リアクションのレンダリングが完了しました');
}

async function renderRelatedEvents(posts, reposts, quotes) {
  console.log(`🔗 関連イベントのレンダリングを開始`);
  const allRelatedEvents = [...posts, ...reposts, ...quotes];
  allRelatedEvents.sort((a, b) => a.created_at - b.created_at);

  relatedEventsList.innerHTML = '';

  for (const event of allRelatedEvents) {
    const date = new Date(event.created_at * 1000).toLocaleString();
    let postContentHtml = '';
    let postTypeLabel = '';

    // relay情報を含めず、IDと作者の公開鍵だけで生成する
    let nevent;
    try {
      nevent = window.NostrTools.nip19.neventEncode({
        id: event.id,
        author: event.pubkey
      });
    } catch (e) {
      nevent = window.NostrTools.nip19.noteEncode(event.id);
    }

    switch (event.kind) {
      case 1:
        postTypeLabel = 'リプライ';
        postContentHtml = `<div class="post-content">${await formatPostContent(event.content, event.tags)}</div>`;
        break;
      case 6:
        postTypeLabel = 'リポスト';
        const repostUser = userProfiles[event.pubkey] || { name: 'Unknown' };
        postContentHtml = `<div class="post-content">${MyNostrUtils.escapeHtml(repostUser.name)}さんがリポストしました</div>`;
        break;
      case 16:
        postTypeLabel = '引用';
        postContentHtml = `<div class="post-content">${await formatPostContent(event.content, event.tags)}</div>`;
        break;
    }

    const html = `
      <div class="related-post-card">
        ${createProfileHtml(event.pubkey)}
        <div class="post-info">
          <span class="post-date">${date}</span>
          <a href="?id=${nevent}" class="post-link-label">${postTypeLabel}</a>
        </div>
        ${postContentHtml}
      </div>
    `;
    relatedEventsList.innerHTML += html;
  }
  
  relatedEventsSection.style.display = 'block';
  console.log('✅ 関連イベントのレンダリングが完了しました');
}

function getPostTypeLabel(kind) {
  switch (kind) {
    case 1:
      return '投稿';
    case 6:
      return 'リポスト';
    case 7:
      return 'リアクション';
    case 40:
      return 'チャンネル作成';
    case 41:
      return 'チャンネル情報更新';
    case 42:
      return 'チャンネルメッセージ';
    default:
      return 'イベント';
  }
}

async function createNostrCard(nostrId) {
  console.log(`Nostrカードを生成中: ${nostrId}`);
  let decoded;
  try {
    decoded = window.NostrTools.nip19.decode(nostrId);
  } catch (e) {
    console.error(`無効なNostr ID: ${nostrId}`, e);
    return `<div class="error-card">無効なNostr ID</div>`;
  }

  const relays = (decoded.data.relays && decoded.data.relays.length > 0) ? decoded.data.relays : FALLBACK_RELAYS;
  const until = Math.floor(Date.now() / 1000);
  let event;

  if (decoded.type === 'npub' || decoded.type === 'nprofile') {
    console.log(`プロフィールカードを生成中: ${decoded.data.id}`);
    const pubkey = decoded.data.id || decoded.data;
    const profileEvent = await pool.get(relays, {
      kinds: [0],
      authors: [pubkey],
      until: until,
      limit: 1
    });
    if (profileEvent) {
      const profile = JSON.parse(profileEvent.content);
      const npub = window.NostrTools.nip19.npubEncode(pubkey);
      const profileHtml = `
        <a href="?id=${npub}">
          <div class="related-post-card">
            ${createProfileHtml(pubkey)}
            <div class="post-info">
              <span>${npub.substring(0, 13) + '...'}</span>
            </div>
            <div class="post-content">
              <p class="post-text">${MyNostrUtils.escapeHtml(profile.about || '')}</p>
            </div>
          </div>
        </a>`;
      console.log('プロフィールカード生成完了');
      return profileHtml;
    }
  } else if (decoded.type === 'note' || decoded.type === 'nevent') {
    console.log(`イベントカードを生成中: ${decoded.data.id}`);
    const eventId = decoded.data.id || decoded.data;
    event = await pool.get(relays, {
      ids: [eventId],
      until: until,
      limit: 1
    });
  } else {
    console.warn(`対応していないIDタイプ: ${decoded.type}`);
    return `<div class="error-card">対応していないIDタイプです</div>`;
  }

  if (!event) {
    console.warn(`イベントが見つかりませんでした: ${nostrId}`);
    return `<div class="related-post-card">イベントが見つかりませんでした</div>`;
  }

  await fetchProfiles([event.pubkey]);
  const date = new Date(event.created_at * 1000).toLocaleString();
  const content = await formatPostContent(event.content.length > 150 ? event.content.substring(0, 150) + '...' : event.content, event.tags);
  const postTypeLabel = getPostTypeLabel(event.kind);
  const eventUrl = `?id=${nostrId}`;

  const eventHtml = `
    <a href="${eventUrl}">
      <div class="related-post-card">
        ${createProfileHtml(event.pubkey)}
        <div class="post-info">
          <span>${date}</span>
          <span>${postTypeLabel}</span>
        </div>
        <div class="post-content">
          <p class="post-text">${content}</p>
        </div>
      </div>
    </a>`;
  console.log('イベントカード生成完了');
  return eventHtml;
}

async function renderEventDetail(nostrId) {
  showStatus('本体データを取得中...');

  const timeout = (ms) => new Promise((_, reject) => 
    setTimeout(() => reject(new Error('タイムアウト')), ms)
  );

  let searchRelays = FALLBACK_RELAYS;

  try {
    const decoded = window.NostrTools.nip19.decode(nostrId);
    const recommendedRelays = decoded.data.relays || [];
    searchRelays = [...new Set([...recommendedRelays, ...FALLBACK_RELAYS])];
    
    let eventId;
    let filters = {};
    const until = Math.floor(Date.now() / 1000);

    switch (decoded.type) {
      case 'note':
      case 'nevent':
        eventId = decoded.data.id || decoded.data;
        filters = { ids: [eventId] };
        break;
      case 'naddr':
        eventId = decoded.data.id;
        filters = { authors: [decoded.data.pubkey], kinds: [decoded.data.kind], '#d': [decoded.data.identifier] };
        break;
      default:
        showStatus('エラー: 無効なID形式です。');
        return;
    }

    // --- ① まずは「メインイベント」だけを最優先で取得 ---
    const mainEvent = await Promise.race([
      pool.get(searchRelays, { ...filters, until, limit: 1 }),
      timeout(10000)
    ]);

    if (!mainEvent) {
      showStatus('イベントが見つかりませんでした');
      pool.close(searchRelays);
      return;
    }

    // --- ② メインイベントのプロフィールだけ先に取って表示！ ---
    showStatus('本体を表示中...');
    await fetchProfiles([mainEvent.pubkey]); // メインの作者だけ先に
    
    // 絵文字マップ（まずはメインイベント分だけ）
    const mainEmojiMap = new Map();
    mainEvent.tags.filter(t => t[0] === 'emoji').forEach(([_, code, url]) => {
      mainEmojiMap.set(`:${code}:`, url);
    });

    // ここで一旦画面に表示！
    await renderMainEvent(mainEvent, mainEmojiMap);

    // --- ③ そのあと「関連イベント」をゆっくり取得 ---
    showStatus('関連イベントを読み込み中...');
    const relatedEvents = await pool.list(searchRelays, [
      { '#e': [eventId], kinds: [1, 6, 7, 16], until }
    ]);

    if (relatedEvents.length > 0) {
      // 関連イベント用のプロフィールと絵文字を補充
      const pubkeys = new Set(relatedEvents.map(e => e.pubkey));
      await fetchProfiles(Array.from(pubkeys));

      const fullEmojiMap = new Map(mainEmojiMap);
      relatedEvents.forEach(ev => {
        ev.tags.filter(t => t[0] === 'emoji').forEach(([_, code, url]) => {
          fullEmojiMap.set(`:${code}:`, url);
        });
      });

      // リアクションとリプライを順次レンダリング
      const reactions = relatedEvents.filter(e => e.kind === 7);
      const posts = relatedEvents.filter(e => e.kind === 1);
      const reposts = relatedEvents.filter(e => e.kind === 6);
      const quotes = relatedEvents.filter(e => e.kind === 16);

      if (reactions.length > 0) renderReactions(reactions, fullEmojiMap);
      if (posts.length || reposts.length || quotes.length) {
        renderRelatedEvents(posts, reposts, quotes);
      }
    }

    showStatus('');
    pool.close(searchRelays); 
    console.log('🔌 完了：すべての読み込みが終わったので解放しました。');

  } catch (err) {
    if (err.message === 'タイムアウト') {
      showStatus('タイムアウトしました。一部のデータが表示されていない可能性があります。');
    } else {
      console.error('❌ Error:', err);
      showStatus('取得中にエラーが発生しました。');
    }
    if (searchRelays) pool.close(searchRelays);
  }
}

async function renderProfileDetail(nostrId) {
  showStatus('プロフィール情報を取得中...');
  
  const timeout = (ms) => new Promise((_, reject) => 
    setTimeout(() => reject(new Error('タイムアウト')), ms)
  );

  let searchRelays = FALLBACK_RELAYS;

  try {
    const decoded = window.NostrTools.nip19.decode(nostrId);
    if (decoded.type !== 'npub' && decoded.type !== 'nprofile') {
      showStatus('エラー: 無効なnpubまたはnprofile形式です。');
      return;
    }

    const recommendedRelays = decoded.data.relays || [];
    searchRelays = [...new Set([...recommendedRelays, ...FALLBACK_RELAYS])];
    const pubkey = decoded.data.id || decoded.data;
    const until = Math.floor(Date.now() / 1000);

    console.log(`🌐 接続リレー (プロフィール): ${searchRelays.join(', ')}`);

    // 【タイムアウト導入】10秒経ったら諦める
    const profileEvent = await Promise.race([
      pool.get(searchRelays, {
        kinds: [0],
        authors: [pubkey],
        until: until,
        limit: 1
      }),
      timeout(10000)
    ]);

    if (!profileEvent) {
      showStatus('プロフィールが見つかりませんでした。');
      pool.close(searchRelays);
      return;
    }

    const profile = JSON.parse(profileEvent.content);
    const npub = window.NostrTools.nip19.npubEncode(pubkey);

    // About文のフォーマット用内部関数
    function formatAboutContent(content, tags) {
      if (!content) return '';
      let formattedContent = MyNostrUtils.escapeHtml(content);
      formattedContent = formattedContent.replace(/\n/g, '<br>');

      const customEmojiMap = new Map();
      tags.filter(t => t[0] === 'emoji').forEach(([_, shortcode, url]) => {
        const imageTag = `<img src="${url}" alt="${shortcode}" class="custom-emoji">`;
        customEmojiMap.set(`:${shortcode}:`, imageTag);
      });

      customEmojiMap.forEach((imageTag, shortcode) => {
        const regex = new RegExp(shortcode.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'), 'g');
        formattedContent = formattedContent.replace(regex, imageTag);
      });

      formattedContent = formattedContent.replace(/(https?:\/\/[^\s]+)/g, (url) => {
        return url.includes('imgur.com') ? url : `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
      });
      return formattedContent;
    }

    const aboutHtml = formatAboutContent(profile.about, profileEvent.tags);

    const html = `
      <div class="profile-card">
        <div class="profile-header">
          <img src="${profile.picture || DEFAULT_PROFILE_IMAGE}" alt="Profile Picture" class="profile-picture">
          <div class="profile-info-container">
            <h2 class="profile-name">${MyNostrUtils.escapeHtml(profile.name || 'No Name')}</h2>
            <div class="npub-container">
              <span id="npub-text" class="npub-text">${npub}</span>
              <svg id="copy-npub-icon" class="copy-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </div>
            <p class="nip05">${profile.nip05 ? MyNostrUtils.escapeHtml(profile.nip05) : 'NIP-05未設定'}</p>
          </div>
        </div>
        <p class="about-text">${aboutHtml}</p>
      </div>`;

    mainEventContainer.innerHTML = html;

    // コピー機能の設定
    const copyIcon = document.getElementById('copy-npub-icon');
    if (copyIcon) {
      copyIcon.onclick = async () => {
        try {
          await navigator.clipboard.writeText(npub);
          alert('npubをコピーしました！');
        } catch (err) {
          alert('コピーに失敗しました。');
        }
      };
    }

    showStatus('');
    pool.close(searchRelays); 
    console.log('🔌 完了：プロフィール接続を解放しました。');

  } catch (err) {
    if (err.message === 'タイムアウト') {
      showStatus('リレーの応答が遅いため、プロフィール取得を中断しました。');
    } else {
      console.error('❌ Error:', err);
      showStatus('プロフィールの取得中にエラーが発生しました。');
    }
    if (searchRelays) pool.close(searchRelays);
  }
}

function renderInputForm() {
  mainEventContainer.innerHTML = `
    <div class="input-form-container">
      <p class="form-title">イベントまたはユーザーのNostr IDを入力してください</p>
      <form id="nostr-form" class="nostr-form">
        <input type="text" id="nostr-id-input" placeholder="nevent1..., npub1..." required class="form-input">
        <button type="submit" class="form-button">表示</button>
      </form>
    </div>`;

  const form = document.getElementById('nostr-form');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('nostr-id-input').value.trim();
    if (input.startsWith('note1') || input.startsWith('nevent1') || input.startsWith('naddr1')) {
      window.location.href = `?id=${input}`;
    } else if (input.startsWith('npub1') || input.startsWith('nprofile1')) {
      window.location.href = `?id=${input}`;
    } else {
      alert('有効なNostr ID (note1, nevent1, naddr1, npub1, nprofile1) を入力してください。');
    }
  });
}

window.onload = () => {
  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get('id');

  if (id) {
    if (id.startsWith('npub1') || id.startsWith('nprofile1')) {
      renderProfileDetail(id);
    } else if (id.startsWith('note1') || id.startsWith('nevent1') || id.startsWith('naddr1')) {
      renderEventDetail(id);
    } else {
      showStatus('エラー: 無効なNostr ID形式です。');
      renderInputForm();
    }
  } else {
    renderInputForm();
  }
};
