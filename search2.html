<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>search</title>
  <link rel="icon" href="https://ompomz.github.io/favicon.ico">
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    .search-form input,
    .search-form button {
      margin: 5px 0;
      padding: 5px;
      width: 100%;
      max-width: 400px;
    }

    .post {
      border-bottom: 1px solid #ccc;
      padding: 10px 0;
    }

    .post-time {
      font-weight: bold;
      margin-right: 10px;
    }

    #more-button {
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="search-form">
    <input type="text" id="npub" placeholder="npub1...">
    <input type="text" id="relay" value="wss://nos.lol/">
    <input type="text" id="keyword" placeholder="word">
    <button onclick="fetchAndUpdatePosts()">search</button>
    <p id="status"></p>
    <div id="post-list"></div>
    <button id="more-button" onclick="handleLoadMore()" style="display:none;">more</button>
  </div>

  <script src="https://unpkg.com/nostr-tools@1.17.0/lib/nostr.bundle.js"></script>
  <script src="utility.js"></script>
  <script src="https://ompomz.github.io/flowgazer/relay-manager.js"></script>
  <script src="https://ompomz.github.io/flowgazer/okkake/sendfav.js"></script>
  <script>
    /* --- 設定 --- */
    let DEFAULT_RELAY = 'wss://relay.nostr.band/';
    let lastUntilTime = Math.floor(Date.now() / 1000);
    let fetchedPosts = []; // メモリ上には全件保持（一時的）

    /**
     * 投稿を表示（MyNostrUtils を活用）
     */
    function renderSimplifiedPosts(posts, append = false) {
      const postList = document.getElementById("post-list");
      const statusMessage = document.getElementById("status");
      if (!postList) return;
      if (!append) postList.innerHTML = '';

      if (posts.length === 0 && !append) {
        if (statusMessage) {
          // lastUntilTime を読みやすい日時に変換
          const untilDate = new Date(lastUntilTime * 1000);
          const dateStr = untilDate.toLocaleDateString();
          const timeStr = untilDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

          statusMessage.textContent = `${dateStr} ${timeStr} まで0件　↓loadmore↓`;
        }
        document.getElementById("more-button").style.display = 'block';
        return;
      }

      posts.forEach(post => {
        const el = document.createElement('div');
        // sendfav.js が見つけられるように 'event' クラスとデータ属性を追加
        el.className = 'post event';
        el.dataset.id = post.id;
        el.dataset.pubkey = post.pubkey;

        const postDate = new Date(post.created_at * 1000);
        const formattedDate = `${postDate.toLocaleDateString()} ${postDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;

        let nevent = post.nevent;
        if (!nevent && post.id) {
          try {
            nevent = NostrTools.nip19.neventEncode({ id: post.id, relays: [DEFAULT_RELAY], author: post.pubkey });
          } catch (e) { nevent = ''; }
        }

        const color = MyNostrUtils.getHslColor(post.pubkey, true);

        const linkHtml = nevent
          ? `<a href="https://ompomz.github.io/tweetsrecap/tweet?id=${nevent}" target="_blank" style="color:${color}; text-decoration:none;">[${formattedDate}]</a>`
          : `<span>[${formattedDate}]</span>`;

        // ユーティリティでリンク化
        const contentHtml = MyNostrUtils.linkify(MyNostrUtils.escapeHtml(post.content));

        el.innerHTML = `${linkHtml} &nbsp; ${contentHtml}`;
        postList.appendChild(el);

        // ★ ここで sendfav.js の長押し機能をセット！
        if (window.attachLongPress) {
          attachLongPress(el);
        }
      });

      if (statusMessage) {
        const untilDate = new Date(lastUntilTime * 1000);
        const timeStr = untilDate.toLocaleDateString() + " " + untilDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        statusMessage.textContent = `表示中：${postList.children.length} 件 （${timeStr} 以前をさらに検索可能）`;
      }
      document.getElementById("more-button").style.display = 'block';
    }

    /**
     * localStorage保存（500件制限 + 重複排除）
     */
    function savePostsToLocalStorage(newPosts = []) {
      // 1. 全データをマージして重複排除
      const all = fetchedPosts.concat(newPosts);
      fetchedPosts = Array.from(new Map(all.map(p => [p.id, p])).values());

      // 2. 作成日時順にソート（新しい順）
      fetchedPosts.sort((a, b) => b.created_at - a.created_at);

      // 3. 保存用データは最新500件に絞る（localStorage容量対策）
      const saveTarget = fetchedPosts.slice(0, 500);

      if (saveTarget.length === 0) {
        ['nostrPosts', 'nostrLastFetchedAt', 'nostrLatestFetchedAt'].forEach(k => localStorage.removeItem(k));
        return;
      }

      try {
        localStorage.setItem('nostrPosts', JSON.stringify(saveTarget));
        localStorage.setItem('nostrLastFetchedAt', String(saveTarget[saveTarget.length - 1].created_at));
        localStorage.setItem('nostrLatestFetchedAt', String(saveTarget[0].created_at));
      } catch (e) {
        console.warn("保存に失敗（容量制限の可能性）:", e);
      }
    }

    /**
     * RelayManager を使った fetchPosts
     */
    async function fetchPosts(relayUrl, pubkey, sinceTime, untilTime) {
      const events = [];
      const subId = 'search-sub-' + Date.now();

      try {
        // マネージャー経由で接続
        await window.relayManager.connect(relayUrl);

        return new Promise((resolve) => {
          let isFinished = false; // フラグを立てる
          // 購読開始
          window.relayManager.subscribe(subId, {
            kinds: [1, 42],
            authors: [pubkey],
            since: sinceTime,
            until: untilTime
          }, (type, event) => {
            if (type === 'EVENT') {
              events.push(event);
            } else if (type === 'EOSE') {
              window.relayManager.unsubscribe(subId);
              resolve(events);
            }
          });

          // 5秒でタイムアウト
          setTimeout(() => {
            if (!isFinished) { // まだ終わってなければ解除
              isFinished = true;
              window.relayManager.unsubscribe(subId);
              resolve(events);
            }
          }, 5000);
        });
      } catch (e) {
        console.error("取得失敗:", e);
        return events;
      }
    }

    /**
     * メイン検索ロジック
     */
    async function fetchAndUpdatePosts(isLoadMore = false) {
      const npubInput = document.getElementById("npub")?.value.trim();
      const keywordInput = document.getElementById("keyword")?.value.trim();
      const statusMessage = document.getElementById("status");

      if (!npubInput || !keywordInput) {
        statusMessage.textContent = 'npubと検索キーワードは必須です。';
        return;
      }

      // ユーティリティでHex化
      const pubkey = await MyNostrUtils.normalizeToHex(npubInput);
      if (!pubkey) {
        statusMessage.textContent = '公開鍵の解析に失敗しました。';
        return;
      }

      statusMessage.textContent = 'リレーから取得中...';
      const relayUrl = document.getElementById("relay")?.value.trim() || DEFAULT_RELAY;

      // 時間範囲の設定
      let since, until;
      if (isLoadMore) {
        until = lastUntilTime;
        since = until - (7 * 24 * 60 * 60); // 1週間遡る
      } else {
        until = Math.floor(Date.now() / 1000);
        since = until - (7 * 24 * 60 * 60);
        if (!isLoadMore) fetchedPosts = []; // 新規検索時は一旦クリア
      }

      const posts = await fetchPosts(relayUrl, pubkey, since, until);

      if (posts.length > 0) {
        const oldest = posts.reduce((a, b) => a.created_at < b.created_at ? a : b);
        lastUntilTime = oldest.created_at;
        savePostsToLocalStorage(posts);
      }

      // 再表示
      const lowerKeyword = keywordInput.toLowerCase();
      const filtered = fetchedPosts.filter(p => p.content.toLowerCase().includes(lowerKeyword));
      renderSimplifiedPosts(filtered, false);
    }

    // ページロード時の自動復元
    window.addEventListener('load', async () => {
      const saved = localStorage.getItem('nostrPosts');
      if (saved) {
        try {
          // データだけメモリに復元しておく
          fetchedPosts = JSON.parse(saved);

          // lastUntilTime も前回の続きから始められるようにセット
          if (fetchedPosts.length > 0) {
            lastUntilTime = fetchedPosts[fetchedPosts.length - 1].created_at;
          }

          // console.log("前回のキャッシュを読み込みました:", fetchedPosts.length, "件");
          // ここで renderSimplifiedPosts(...) を呼ばないことで、見た目は空のままになります
        } catch (e) {
          console.error("キャッシュの復元に失敗:", e);
        }
      }
    });

    async function handleLoadMore() {
      await fetchAndUpdatePosts(true);
    }
  </script>
</body>

</html>
