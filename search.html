<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nostr検索ツール</title>

  <style>
    body { font-family: sans-serif; padding: 20px; }
    input, button { margin: 5px; padding: 8px; }
    #results div {
      border: 1px solid #ccc;
      padding: 10px;
      margin: 10px 0;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Nostr検索ツール</h1>
  <input type="text" id="authorPubkey" placeholder="公開鍵">
  <input type="text" id="searchWord" placeholder="検索ワード">
  <button onclick="searchMyEvents()">検索</button>
  <button onclick="searchMore()">もっと見る</button>
  <div id="results"></div>

  <script src="https://unpkg.com/nostr-tools@2.17.2/lib/nostr.bundle.js"></script>
<script>
  const RELAY_URL = "wss://relay.nostr.band";
  const pool = new NostrTools.SimplePool();
  const relays = [RELAY_URL];
  let lastTimestamp = Math.floor(Date.now() / 1000);

  function escapeHTML(str) {
    return str.replace(/[&<>"']/g, (m) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;',
      '"': '&quot;', "'": '&#39;',
    }[m]));
  }

  function displayEvent(event) {
    const div = document.createElement("div");
    div.innerHTML = `
      <strong>日時:</strong> ${new Date(event.created_at * 1000).toLocaleString()}<br>
      <strong>内容:</strong><br>${escapeHTML(event.content)}
    `;
    div.style.border = "1px solid #ccc";
    div.style.margin = "10px 0";
    div.style.padding = "10px";
    document.getElementById("results").appendChild(div);
  }

  async function normalizePubkey(input) {
    if (input.startsWith("npub1")) {
      try {
        const { type, data } = NostrTools.nip19.decode(input);
        if (type === "npub") return data;
      } catch (e) {
        console.error("npubのデコードに失敗:", e);
        return null;
      }
    } else if (/^[a-f0-9]{64}$/i.test(input)) {
      return input;
    } else {
      return null;
    }
  }

  async function searchMyEvents() {
    const input = document.getElementById("authorPubkey").value.trim();
    const keyword = document.getElementById("searchWord").value.trim();
    const resultsDiv = document.getElementById("results");
    resultsDiv.innerHTML = "";
    lastTimestamp = Math.floor(Date.now() / 1000);

    const pubkey = await normalizePubkey(input);
    if (!pubkey) {
      alert("有効な公開鍵（npubまたはhex）を入力してください。");
      return;
    }

    const filters = {
      kinds: [1, 42],
      authors: [pubkey],
      limit: 500,
    };

    console.log("🔍 検索フィルター:", filters);
    let eventCount = 0;

    pool.subscribeMany(relays, [filters], {
      onevent(event) {
        eventCount++;
        console.log("📨 イベント受信:", event);
        if (!keyword || event.content.includes(keyword)) {
          displayEvent(event);
        }
        if (event.created_at < lastTimestamp) {
          lastTimestamp = event.created_at;
        }
      },
      oneose() {
        console.log(`✅ 検索完了（${eventCount} 件受信）`);
      }
    });
  }

  async function searchMore() {
    const input = document.getElementById("authorPubkey").value.trim();
    const keyword = document.getElementById("searchWord").value.trim();

    const pubkey = await normalizePubkey(input);
    if (!pubkey) {
      alert("有効な公開鍵（npubまたはhex）を入力してください。");
      return;
    }

    const now = Math.floor(Date.now() / 1000);
    if (lastTimestamp > now) lastTimestamp = now;

    const filters = {
      kinds: [1, 42],
      authors: [pubkey],
      until: lastTimestamp,
      limit: 500,
    };

    console.log("🔍 さらに過去の検索フィルター:", filters);
    let eventCount = 0;

    pool.subscribeMany(relays, [filters], {
      onevent(event) {
        eventCount++;
        console.log("📨 過去イベント受信:", event);
        if (!keyword || event.content.includes(keyword)) {
          displayEvent(event);
        }
        if (event.created_at < lastTimestamp) {
          lastTimestamp = event.created_at;
        }
      },
      oneose() {
        console.log(`✅ さらに過去の検索完了（${eventCount} 件受信）`);
      }
    });
  }
</script>
</body>
</html>
