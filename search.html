<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nostr検索ツール</title>

  <style>
    body { font-family: sans-serif; padding: 20px; }
    input, button { margin: 5px; padding: 8px; }
    #results div {
      border: 1px solid #ccc;
      padding: 10px;
      margin: 10px 0;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Nostr検索ツール</h1>
  <input type="text" id="authorPubkey" placeholder="公開鍵">
  <input type="text" id="searchWord" placeholder="検索ワード">
  <button onclick="searchMyEvents()">検索</button>
  <button onclick="searchMore()">もっと見る</button>
  <div id="results"></div>
    <script src="https://unpkg.com/nostr-tools@2.17.2/lib/nostr.bundle.js"></script>
<script>
  const RELAY_URL = "wss://relay.nostr.band";
  const relay = new NostrTools.Relay(RELAY_URL);
  let lastTimestamp = Math.floor(Date.now() / 1000);

  function escapeHTML(str) {
    return str.replace(/[&<>"']/g, (m) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;',
      '"': '&quot;', "'": '&#39;',
    }[m]));
  }

  function displayEvent(event) {
    const div = document.createElement("div");
    div.innerHTML = `
      <strong>日時:</strong> ${new Date(event.created_at * 1000).toLocaleString()}<br>
      <strong>内容:</strong><br>${escapeHTML(event.content)}
    `;
    div.style.border = "1px solid #ccc";
    div.style.margin = "10px 0";
    div.style.padding = "10px";
    document.getElementById("results").appendChild(div);
  }

  async function searchMyEvents() {
    const pubkey = document.getElementById("authorPubkey").value.trim();
    const keyword = document.getElementById("searchWord").value.trim();
    const resultsDiv = document.getElementById("results");
    resultsDiv.innerHTML = "";
    lastTimestamp = Math.floor(Date.now() / 1000);

    if (!pubkey) {
      alert("公開鍵を入力してください。");
      return;
    }

    console.log("🔌 リレー接続中:", RELAY_URL);
    await relay.connect();
    console.log("✅ リレー接続完了");

    const filters = {
      kinds: [1, 42],
      limit: 500,
    };
    if (pubkey) {
      filters.authors = [pubkey];
    }

    console.log("🔍 検索フィルター:", filters);

    const sub = relay.subscribe([filters], { id: "searchMyEvents" });
    let eventCount = 0;

    sub.on("event", (event) => {
      eventCount++;
      console.log("📨 イベント受信:", event);
      if (!keyword || event.content.includes(keyword)) {
        displayEvent(event);
      }
      if (event.created_at < lastTimestamp) {
        lastTimestamp = event.created_at;
      }
    });

    sub.on("eose", () => {
      console.log(`✅ 検索完了（${eventCount} 件受信）`);
      sub.close();
    });
  }

  async function searchMore() {
    const pubkey = document.getElementById("authorPubkey").value.trim();
    const keyword = document.getElementById("searchWord").value.trim();

    if (!pubkey) {
      alert("公開鍵を入力してください。");
      return;
    }

    console.log("🔌 リレー再接続:", RELAY_URL);
    await relay.connect();
    console.log("✅ 接続完了");

    const filters = {
      kinds: [1, 42],
      until: lastTimestamp,
      limit: 500,
    };
    if (pubkey) {
      filters.authors = [pubkey];
    }

    console.log("🔍 さらに過去の検索フィルター:", filters);

    const sub = relay.subscribe([filters], { id: "searchMore" });
    let eventCount = 0;

    sub.on("event", (event) => {
      eventCount++;
      console.log("📨 過去イベント受信:", event);
      if (!keyword || event.content.includes(keyword)) {
        displayEvent(event);
      }
      if (event.created_at < lastTimestamp) {
        lastTimestamp = event.created_at;
      }
    });

    sub.on("eose", () => {
      console.log(`✅ さらに過去の検索完了（${eventCount} 件受信）`);
      sub.close();
    });
  }
</script>
</body>
</html>
