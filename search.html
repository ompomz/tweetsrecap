<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Nostr検索ツール</title>
  <script src="https://unpkg.com/nostr-tools@2.17.2/lib/nostr.bundle.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input, button { margin: 5px 0; padding: 5px; width: 100%; }
    .event { border: 1px solid #ccc; margin: 10px 0; padding: 10px; }
  </style>
</head>
<body>
  <h2>Nostr検索ツール</h2>
  <input id="npub" placeholder="npub または hex 公開鍵">
  <input id="relays" placeholder="リレーURL（カンマ区切り）">
  <input id="keyword" placeholder="検索ワード">
  <button onclick="startSearch()">検索</button>
  <button onclick="searchMore()">もっと見る</button>
  <div id="results"></div>

  <script>
    const pool = new NostrTools.SimplePool();
    let lastTimestamp = Math.floor(Date.now() / 1000);
    let pubkey = null;
    let keyword = "";
    let relayList = [];

    async function normalizePubkey(input) {
      if (input.startsWith("npub1")) {
        try {
          const { type, data } = NostrTools.nip19.decode(input);
          if (type === "npub") return data;
        } catch (e) {
          console.error("npubのデコード失敗:", e);
          return null;
        }
      } else if (/^[a-f0-9]{64}$/i.test(input)) {
        return input;
      }
      return null;
    }

    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;',
        '"': '&quot;', "'": '&#39;',
      }[m]));
    }

    function displayEvent(event) {
      const div = document.createElement("div");
      div.className = "event";
      div.innerHTML = `
        <strong>日時:</strong> ${new Date(event.created_at * 1000).toLocaleString()}<br>
        <strong>内容:</strong><br>${escapeHTML(event.content)}
      `;
      document.getElementById("results").appendChild(div);
    }

    async function startSearch() {
      document.getElementById("results").innerHTML = "";
      lastTimestamp = Math.floor(Date.now() / 1000);

      const npubInput = document.getElementById("npub").value.trim();
      const relayInput = document.getElementById("relays").value.trim();
      keyword = document.getElementById("keyword").value.trim();

      pubkey = await normalizePubkey(npubInput);
      if (!pubkey) {
        alert("有効な公開鍵を入力してください");
        return;
      }

      relayList = relayInput.split(",").map(r => r.trim()).filter(r => r.startsWith("wss://"));
      if (relayList.length === 0) {
        alert("リレーURLを1つ以上入力してください");
        return;
      }

      await searchBatch();
    }

    async function searchMore() {
      await searchBatch();
    }

    async function searchBatch() {
      const filters = [{
        kinds: [1, 42],
        authors: [pubkey],
        until: lastTimestamp,
        limit: 500
      }];

      let matched = false;

      await new Promise((resolve) => {
        pool.subscribeMany(relayList, filters, {
          onevent(event) {
            if (event.created_at < lastTimestamp) {
              lastTimestamp = event.created_at;
            }
            if (event.content && keyword && event.content.includes(keyword)) {
              displayEvent(event);
              matched = true;
            }
          },
          oneose() {
            resolve();
          }
        });
      });

      if (!matched) {
        console.log("ヒットなし。さらに過去を検索できます。");
      }
    }
  </script>
</body>
</html>
