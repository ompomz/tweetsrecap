<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
  <title>Nostr 投稿検索</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input, button { margin: 5px 0; padding: 5px; width: 100%; max-width: 400px; }
    .post { border-bottom: 1px solid #ccc; padding: 10px 0; }
    .post-time { font-weight: bold; margin-right: 10px; }
    #more-button { margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Nostr 投稿検索</h1>
  <label>npub または NIP-05 アドレス（必須）</label><br/>
  <input type="text" id="npub" placeholder="npub1..." /><br/>
  <label>リレーURL（任意）</label><br />
  <input type="text" id="relay" placeholder="wss://..." /><br/>
  <label>検索キーワード（必須）</label><br />
  <input type="text" id="keyword" placeholder="投稿に含まれる語句" /><br/>
  <button onclick="handleSearch()">検索</button>
  <p id="status"></p>
  <div id="post-list"></div>
  <button id="more-button" onclick="handleLoadMore()" style="display:none;">もっと探す</button>
  
  <script src="https://unpkg.com/nostr-tools@1.17.0/lib/nostr.bundle.js"></script>
  <script>
  let DEFAULT_RELAY = 'wss://relay.nostr.band';
  let lastUntilTime = Math.floor(Date.now() / 1000); // 現在時刻（秒）
  let fetchedPosts = [];

  async function normalizePubkey(input) {
    if (input.startsWith("npub1")) {
      try {
        const { type, data } = NostrTools.nip19.decode(input);
        if (type === 'npub') return data;
      } catch (e) {
        console.error("npubのデコードに失敗:", e);
        return null;
      }
    } else if (/^[a-f0-9]{64}$/i.test(input)) {
      return input;
    } else if (input.includes('@')) {
      const parts = input.split('@');
      if (parts.length !== 2) return null;
      const [name, domain] = parts;
      try {
        const response = await fetch(`https://${domain}/.well-known/nostr.json?name=${name}`);
        const data = await response.json();
        return data.names[name] || null;
      } catch (e) {
        console.error("NIP-05の解決に失敗:", e);
        return null;
      }
    }
    return null;
  }

  async function fetchPosts(relayUrl, pubkey, sinceTime, untilTime) {
    const events = [];
    try {
      const relay = NostrTools.relayInit(relayUrl);
      await relay.connect();
      const sub = relay.sub([{
        kinds: [1, 42],
        authors: [pubkey],
        since: sinceTime,
        until: untilTime
      }]);
      return new Promise((resolve) => {
        sub.on('event', (event) => events.push(event));
        sub.on('eose', () => {
          relay.close();
          resolve(events);
        });
        setTimeout(() => {
          relay.close();
          resolve(events);
        }, 5000);
      });
    } catch (e) {
      console.error("投稿取得に失敗:", e);
      return events;
    }
  }

  function filterPostsByKeyword(posts, keyword) {
    const lowerKeyword = keyword.toLowerCase();
    return posts.filter(post => post.content.toLowerCase().includes(lowerKeyword));
  }
  
  function renderPosts(posts, append = false) {
    const postList = document.getElementById("post-list");
    const statusMessage = document.getElementById("status");

    if (!append) {
      postList.innerHTML = '';
    }

    if (posts.length === 0 && !append) {
      statusMessage.textContent = '見つかりませんでした。もっと探す？';
      document.getElementById("more-button").style.display = 'block';
      return;
    }

    posts.forEach(post => {
      const postElement = document.createElement('div');
      postElement.className = 'post';

      const postDate = new Date(post.created_at * 1000);
      const formattedDate = `${postDate.toLocaleDateString()} ${postDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;

      postElement.innerHTML = `
        <div>
          <span class="post-time">[${formattedDate}]</span>
          ${escapeHtml(post.content)}
        </div>
      `;

      postList.appendChild(postElement);
    });

    statusMessage.textContent = `表示中の投稿数：${postList.children.length} 件`;
    document.getElementById("more-button").style.display = 'block';
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, function (m) {
      return ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[m];
    });
  }

    async function handleSearch() {
    const npubInput = document.getElementById("npub").value.trim();
    const relayInput = document.getElementById("relay").value.trim();
    const keywordInput = document.getElementById("keyword").value.trim();
    const statusMessage = document.getElementById("status");
    const postList = document.getElementById("post-list");
    const moreButton = document.getElementById("more-button");

    postList.innerHTML = '';
    statusMessage.textContent = '検索中...';
    moreButton.style.display = 'none';
    fetchedPosts = [];

    if (!npubInput || !keywordInput) {
      statusMessage.textContent = 'npubと検索キーワードは必須です。';
      return;
    }

    const pubkey = await normalizePubkey(npubInput);
    if (!pubkey) {
      statusMessage.textContent = 'npubまたはNIP-05の形式が正しくありません。';
      return;
    }

    const relayUrl = relayInput || DEFAULT_RELAY;
    const now = Math.floor(Date.now() / 1000);
    const oneWeekAgo = now - 7 * 24 * 60 * 60;
    lastUntilTime = now;

    const posts = await fetchPosts(relayUrl, pubkey, oneWeekAgo, now);
    console.log(`[Search] 取得件数: ${posts.length}`);
    if (posts.length > 0) {
      const oldest = posts.reduce((a, b) => a.created_at < b.created_at ? a : b);
      console.log(`[Search] 最古の投稿日時: ${new Date(oldest.created_at * 1000).toLocaleString()}`);
      lastUntilTime = oldest.created_at;
    }

    fetchedPosts = posts;
    const filtered = filterPostsByKeyword(posts, keywordInput);
    renderPosts(filtered, false);
  }

  async function handleLoadMore() {
    const npubInput = document.getElementById("npub").value.trim();
    const relayInput = document.getElementById("relay").value.trim();
    const keywordInput = document.getElementById("keyword").value.trim();
    const statusMessage = document.getElementById("status");

    if (!npubInput || !keywordInput) {
      statusMessage.textContent = 'npubと検索キーワードは必須です。';
      return;
    }

    const pubkey = await normalizePubkey(npubInput);
    if (!pubkey) {
      statusMessage.textContent = 'npubまたはNIP-05の形式が正しくありません。';
      return;
    }

    const relayUrl = relayInput || DEFAULT_RELAY;
    const newUntil = lastUntilTime;
    const newSince = newUntil - 7 * 24 * 60 * 60;

    const posts = await fetchPosts(relayUrl, pubkey, newSince, newUntil);
    console.log(`[More] 取得件数: ${posts.length}`);
    if (posts.length > 0) {
      const oldest = posts.reduce((a, b) => a.created_at < b.created_at ? a : b);
      console.log(`[More] 最古の投稿日時: ${new Date(oldest.created_at * 1000).toLocaleString()}`);
      lastUntilTime = oldest.created_at;
    }

    fetchedPosts = fetchedPosts.concat(posts);
    const filtered = filterPostsByKeyword(posts, keywordInput);
    renderPosts(filtered, true);
  }
</script>
</body>
</html>
